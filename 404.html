<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- GitHub Pages serves this for any address that doesn't exist, with a 404
     status. Without it, Pages answered missing addresses with a 503, which
     search engines read as the whole site being down. Paths are absolute
     because this page is served at whatever address was asked for. -->
<title>Page Not Found — Follow My Astrolabe</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/favicon.png">
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<main style="padding: 64px 24px; text-align: center; max-width: 40ch; margin-inline: auto">
  <h1>This page isn't here.</h1>
  <p>The address may have changed, or it may have been mistyped.</p>
  <p><a href="/">Go to the homepage</a> or <a href="/app/">open the web app</a>.</p>
</main>
</body>
</html>
